<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-label="侧栏布局示意：56px 图标列 + 会话列 + 内容列">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .rail{fill:#f6f8fa}
      .col{fill:#fbfcfd}
      .bd{stroke:#d8dee4;stroke-width:1}
      .icon{fill:none;stroke:#6e7781;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .txt{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
      .dim{fill:#6e7781}
      .bar{fill:#eaeef2}
      .accent{fill:#0969da}
      .accentBg{fill:#ddf4ff}
      .chip{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="719" height="435" rx="12" stroke="#d8dee4"/>

  <!-- 图标列 -->
  <path class="rail" d="M12 1 h56 v396 h-56 a11 11 0 0 1 -11 -11 v-374 a11 11 0 0 1 11 -11 z"/>
  <line class="bd" x1="68" y1="1" x2="68" y2="397"/>

  <!-- 图标列内容 -->
  <g transform="translate(24,22)">
    <rect class="icon" x="0" y="0" width="20" height="20" rx="5"/>
    <line class="icon" x1="7" y1="1.5" x2="7" y2="18.5"/>
  </g>
  <g transform="translate(26,62)">
    <path class="icon" d="M9 1 v16 M1 9 h16"/>
  </g>
  <g transform="translate(25,101)">
    <rect class="icon" x="0.5" y="0.5" width="9" height="9" rx="2"/>
    <rect class="icon" x="12.5" y="0.5" width="9" height="9" rx="2"/>
    <rect class="icon" x="0.5" y="12.5" width="9" height="9" rx="2"/>
    <rect class="icon" x="12.5" y="12.5" width="9" height="9" rx="2"/>
  </g>
  <g transform="translate(26,140)">
    <rect class="icon" x="1" y="0.5" width="16" height="15" rx="3"/>
    <path class="icon" d="M9 6 v7 M5.5 9.5 h7"/>
  </g>
  <g transform="translate(26,179)">
    <circle class="icon" cx="9" cy="9" r="7.5"/>
    <path class="icon" d="M9 4.5 v5 l3 2"/>
  </g>
  <g transform="translate(26,218)">
    <rect class="icon" x="1" y="1" width="16" height="16" rx="2.5"/>
    <path class="icon" d="M4 6 h10 M4 9.5 h10 M4 13 h6"/>
  </g>
  <g transform="translate(25,257)">
    <rect class="icon" x="0.5" y="2.5" width="17" height="13" rx="2.5"/>
    <line class="icon" x1="6.5" y1="2.5" x2="6.5" y2="15.5"/>
  </g>

  <!-- 调色板入口（高亮） -->
  <rect class="accentBg" x="10" y="298" width="48" height="32" rx="8"/>
  <g transform="translate(26,306)">
    <path class="accent" style="fill:none;stroke:#0969da;stroke-width:1.4;stroke-linejoin:round" d="M8.5 1.5a7 7 0 1 0 0 14c1.05 0 1.6-.8 1.6-1.6 0-.55-.24-.9-.55-1.23-.22-.27-.44-.55-.44-1.02 0-.68.55-1.23 1.23-1.23h1.2A3.6 3.6 0 0 0 15 6.9C15 4.15 12 1.5 8.5 1.5Z"/>
    <circle cx="5.4" cy="6" r="1" fill="#0969da"/>
    <circle cx="8.9" cy="4.8" r="1" fill="#0969da"/>
    <circle cx="4.8" cy="9.6" r="1" fill="#0969da"/>
  </g>

  <!-- 会话列 -->
  <rect class="col" x="69" y="1" width="219" height="396"/>
  <line class="bd" x1="287" y1="1" x2="287" y2="397"/>

  <!-- 新会话 -->
  <rect class="chip" x="81" y="20" width="194" height="30" rx="8"/>
  <g transform="translate(93,29)">
    <path d="M9 1 v10 M4 6 h10" fill="none" stroke="#1f2328" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text class="txt" x="113" y="40" font-size="12">新会话</text>

  <!-- 工作区分组 1 -->
  <g transform="translate(85,72)">
    <path d="M1 4 l4 4 l-4 4" fill="none" stroke="#6e7781" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="txt" x="97" y="80" font-size="12" font-weight="600">论文写作</text>
  <text class="dim" x="243" y="80" font-size="11" text-anchor="end">3</text>

  <rect class="bar" x="81" y="88" width="194" height="24" rx="6"/>
  <text class="txt" x="93" y="104" font-size="11.5">安装论文写作类 skill</text>
  <text class="txt" x="93" y="132" font-size="11.5">侧栏字体调优</text>
  <text class="mono dim" x="93" y="156" font-size="10.5">dsh-sidebar-tuner</text>

  <!-- 工作区分组 2 -->
  <g transform="translate(85,182)">
    <path d="M1 4 l4 4 l-4 4" fill="none" stroke="#6e7781" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="txt" x="97" y="190" font-size="12" font-weight="600">harness</text>
  <text class="dim" x="243" y="190" font-size="11" text-anchor="end">2</text>

  <text class="txt" x="93" y="214" font-size="11.5">插件更新与自检</text>
  <text class="txt" x="93" y="238" font-size="11.5">purge 迁移</text>

  <!-- 内容列 -->
  <text class="txt" x="310" y="34" font-size="13" font-weight="600">安装论文写作类 skill</text>
  <text class="dim" x="472" y="34" font-size="11">标准模式</text>

  <g font-size="12">
    <text class="txt" x="310" y="66" font-weight="600">对话</text>
    <rect class="accent" x="310" y="74" width="24" height="2" rx="1"/>
    <text class="dim" x="358" y="66">轨迹</text>
    <text class="dim" x="406" y="66">上下文</text>
    <text class="dim" x="468" y="66">编排</text>
  </g>
  <line class="bd" x1="296" y1="86" x2="708" y2="86"/>

  <rect class="bar" x="310" y="104" width="330" height="10" rx="5"/>
  <rect class="bar" x="310" y="124" width="284" height="10" rx="5"/>
  <rect class="bar" x="310" y="144" width="360" height="10" rx="5"/>
  <rect class="bar" x="310" y="164" width="196" height="10" rx="5"/>

  <rect class="chip" x="310" y="240" width="380" height="88" rx="10"/>
  <text class="dim" x="326" y="276" font-size="11.5">发消息或创建任务，/ 调用指令，@ 文件或对话</text>
  <circle cx="330" cy="308" r="9" fill="none" stroke="#d0d7de"/>
  <path d="M326 308 h8 M330 304 v8" stroke="#6e7781" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 尺寸标注 -->
  <line x1="1" y1="412" x2="67" y2="412" stroke="#8c959f" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text class="dim" x="34" y="428" font-size="10.5" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">56px</text>

  <line x1="69" y1="412" x2="286" y2="412" stroke="#8c959f" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text class="dim" x="177" y="428" font-size="10.5" text-anchor="middle">图标列 + 会话列（侧栏宽度可拖拽）</text>

  <line x1="296" y1="412" x2="707" y2="412" stroke="#8c959f" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text class="dim" x="501" y="428" font-size="10.5" text-anchor="middle">内容列（不受本插件影响）</text>

  <!-- 调色板入口标注 -->
  <path d="M62 314 h16" stroke="#0969da" stroke-width="1" stroke-dasharray="3 2"/>
  <text class="accent" x="86" y="310" font-size="10.5" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">调色板入口</text>
  <text class="dim" x="86" y="324" font-size="10.5" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">点击打开设置面板</text>
</svg>
