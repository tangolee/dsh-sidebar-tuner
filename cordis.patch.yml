# dsh-sidebar-tuner bundle patch
#
# 全部样式都通过 ctx.styles.insert 注入，不改动任何其它插件的文件或代码。
# 改完点侧栏刷新按钮（dsh-unlag）或完全重启 DSH 生效。

- insert:
    - id: sidebar-tuner
      name: dsh-sidebar-tuner
      config:
        # ── 排版 ──────────────────────────────────────────────
        # 字体栈原始覆盖（非空则优先于下面的三段式）
        fontFamily: ''
        # 中文字体 / 英文字体 / 回退项（面板里可直接选）
        fontFamilyZh: ''
        fontFamilyEn: ''
        fontFallbacks: [system-ui, sans-serif]
        # 扁平字号（px，0 = 关闭）。开启后侧栏所有文字统一成这个字号
        fontSize: 0
        # 整列等比缩放（1 = 关闭）。保留字号层级
        fontScale: 1
        # 行高（无单位倍数，0 = 关闭）
        lineHeight: 1.55
        # 行距（px，额外上下外边距，0 = 关闭）
        rowGap: 2

        # ── 内容区（对话）──────────────────────────────────────
        # 原始字体栈覆盖（非空则优先于下面的三段式，yml 专属，面板不暴露）
        contentFont: ''
        # 中英文分段字体；留空 = 跟随 DSH「设置 → 外观」里的文字字体
        contentFontZh: ''
        contentFontEn: ''
        contentFontFallbacks: [system-ui, sans-serif]
        # 对话正文字号 px，0 = 跟随 DSH 的字号设置（DSH 本身允许 10–22）
        contentFontSize: 0
        # 对话正文行高倍数，0 = 用 DSH 自己的换算
        contentLineHeight: 0
        # 对话区代码的等宽字体，留空 = 跟随 DSH 代码字体
        contentCodeFont: ''
        # 对话区代码字号 px，0 = 跟随 DSH 的代码字号设置
        contentCodeFontSize: 0

        # 不跟字体/行高/整列缩放的区域（CSS 选择器列表）
        # 默认排除侧栏底部动作槽：计费卡片按自己的像素排版，跟着放大缩小会挤成一团
        fontExclude:
          - '[data-slot="sidebar.footer.action"]'

        # ── 字距与字形（0.3.0）────────────────────────────────
        # 字距，单位 em。0 = 不改；-0.011 是 Inter 官方给 14–16px 的建议值
        letterSpacing: 0
        # 字重，0 = 用 DSH 自己的字重。450 这类中间值需要可变字体
        fontWeight: 0
        # OpenType 特性，可多选：calt / case / tnum / ss01 / cv11
        fontFeatures: []

        # ── 终端（0.3.0）──────────────────────────────────────
        # true = 终端跟随「对话区 → 代码字体」，下面的 terminalFontFamily 失效
        terminalFollowCode: true
        # 终端专用等宽字体，留空 = 不覆盖。只作用于终端容器，不动全局代码字体
        # 注意：xterm 只在创建时读一次容器字体，已打开的终端需关掉标签重开
        terminalFontFamily: ''
        # 终端字号 px，0 = 关闭。xterm 内部写死 13px，改动有度量错位风险（实验项）
        terminalFontSize: 0
        # 终端字距 px，0 = 关闭（实验项）
        terminalLetterSpacing: 0
        # 终端连字（calt / liga）
        terminalLigatures: false

        # 展开态内部重排：图标列 56px + 会话列（不折叠即可得到 Codex 布局）
        compactLayout: true

        # 鼠标停在图标上时浮出该图标的名称（图标列只留图标时用）
        railTooltips: true

        # ── 折叠态：图标栏 + 右侧对话列（类 Codex） ──────────────
        # false = 完全不动 DSH 折叠行为
        collapsedRail: true
        # 图标栏宽度（px）
        railWidth: 56
        # 右侧工作区/会话列宽度（px）
        panelWidth: 232
        # 搜索框并入图标栏：常态一个图标宽，聚焦后向右展开
        searchInRail: true
        # 图标列入口用哪枚 Lucide 图标：palette / sliders / swatch / brush
        railIcon: sliders
        # 折叠时给中间内容列让位（推挤而非覆盖）
        pushContent: true
        # 调试：开启后页面加载会把侧栏真实 DOM 结构回传到 probe.jsonl（排查完记得关）
        debugDump: false

        # 是否注入设置面板本身（false = 只上样式，藏掉入口与面板；yml 专属）
        settingsUi: true

        # 叠层 z-index 基准
        zIndex: 30

